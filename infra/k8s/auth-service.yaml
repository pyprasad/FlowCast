apiVersion: v1
kind: ConfigMap
metadata:
  name: auth-service-config
  namespace: creatorflow
data:
  PORT: "4001"
  NODE_ENV: "production"
  LOG_LEVEL: "info"
  JWT_ACCESS_EXPIRY: "15m"
  JWT_REFRESH_EXPIRY: "7d"
  BCRYPT_ROUNDS: "10"
---
apiVersion: v1
kind: Secret
metadata:
  name: auth-service-secret
  namespace: creatorflow
type: Opaque
stringData:
  DATABASE_URL: postgresql://postgres:CHANGE_ME@postgres:5432/creatorflow_auth?schema=public
  REDIS_URL: redis://redis:6379
  JWT_SECRET: CHANGE_ME_IN_PRODUCTION_STRONG_SECRET
  EMAIL_PROVIDER_API_KEY: CHANGE_ME
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-service
  namespace: creatorflow
  labels:
    app: auth-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: auth-service
  template:
    metadata:
      labels:
        app: auth-service
    spec:
      containers:
        - name: auth-service
          image: creatorflow/auth-service:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 4001
              name: http
          envFrom:
            - configMapRef:
                name: auth-service-config
            - secretRef:
                name: auth-service-secret
          livenessProbe:
            httpGet:
              path: /health
              port: 4001
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 4001
            initialDelaySeconds: 10
            periodSeconds: 5
          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "512Mi"
              cpu: "500m"
---
apiVersion: v1
kind: Service
metadata:
  name: auth-service
  namespace: creatorflow
spec:
  selector:
    app: auth-service
  ports:
    - port: 4001
      targetPort: 4001
  type: ClusterIP
